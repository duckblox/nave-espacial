<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nave Espacial</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#05050f;color:#f0f0fa;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:8px;}
  canvas{background:#05050f;max-width:100%;max-height:80vh;height:auto;border:2px solid #223047;border-radius:10px;touch-action:none;}
  #dica{font-size:12px;opacity:.65;text-align:center;padding:0 12px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="jogo" width="900" height="650"></canvas>
  <div id="dica">Celular: toque e arraste para mover (atira sozinho) · Teclado: setas/WASD move, espaço atira, F tiro automático, 1-4 trocam de nave</div>
</div>
<script>
(function(){
const canvas=document.getElementById('jogo');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);

// ---------- som (sintetizado, sem arquivos de áudio) ----------
let actx=null;
function getCtx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tom(f1,f2,dur,vol=0.2,tipo='square'){
  try{
    const ac=getCtx(), osc=ac.createOscillator(), gain=ac.createGain();
    osc.type=tipo; osc.frequency.setValueAtTime(f1,ac.currentTime);
    osc.frequency.linearRampToValueAtTime(f2,ac.currentTime+dur/1000);
    gain.gain.setValueAtTime(vol,ac.currentTime);
    gain.gain.linearRampToValueAtTime(0,ac.currentTime+dur/1000);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime+dur/1000);
  }catch(e){}
}
function ruido(dur,vol=0.25){
  try{
    const ac=getCtx(), n=Math.floor(ac.sampleRate*dur/1000);
    const buf=ac.createBuffer(1,n,ac.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(); src.buffer=buf;
    const gain=ac.createGain(); gain.gain.value=vol;
    src.connect(gain); gain.connect(ac.destination); src.start();
  }catch(e){}
}
const somTiro=()=>tom(880,880,60,0.12);
const somExplosao=()=>ruido(200,0.25);
const somDano=()=>tom(300,120,200,0.25);
const somFim=()=>tom(440,80,700,0.25);
const somFase=()=>tom(440,1100,350,0.25);
const somSkin=()=>tom(660,1320,450,0.25);

// ---------- progresso salvo no navegador ----------
const SKINS=[
  {nome:'Padrão',cor:'#50dcff',chama:'#ff8c28',recorde:0},
  {nome:'Fantasma',cor:'#d7d7ff',chama:'#96aaff',recorde:150},
  {nome:'Fênix',cor:'#ff8c28',chama:'#ff4646',recorde:400},
  {nome:'Esmeralda',cor:'#5aff8c',chama:'#ffff78',recorde:800},
];
function carregar(){
  try{ const d=JSON.parse(localStorage.getItem('nave_progresso')||'{}');
    return {recorde:d.recorde||0, skin:d.skin||0}; }catch(e){ return {recorde:0,skin:0}; }
}
function salvar(){ try{ localStorage.setItem('nave_progresso',JSON.stringify(progresso)); }catch(e){} }
function desbloqueadas(){ return SKINS.map((s,i)=>i).filter(i=>progresso.recorde>=SKINS[i].recorde); }
let progresso=carregar();

// ---------- estrelas (parallax) ----------
let estrelas=[];
for(let i=0;i<120;i++){ const c=1+Math.floor(Math.random()*3); estrelas.push({x:rand(0,W),y:rand(0,H),r:c*0.6,v:c*0.9}); }
function atualizarEstrelas(){ for(const e of estrelas){ e.y+=e.v; if(e.y>H){ e.y=0; e.x=rand(0,W); } } }
function desenharEstrelas(){
  for(const e of estrelas){
    const b=120+e.r*60;
    ctx.fillStyle=`rgb(${b|0},${b|0},${Math.min(255,b+30)|0})`;
    ctx.beginPath(); ctx.arc(e.x,e.y,Math.max(1,e.r),0,Math.PI*2); ctx.fill();
  }
}

// ---------- partículas ----------
let particulas=[];
function explodir(x,y,cor,qtd=22){
  for(let i=0;i<qtd;i++){
    const ang=rand(0,Math.PI*2), v=rand(1.5,6), vida=rand(20,40);
    particulas.push({x,y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,vida,vidaMax:vida,cor});
  }
}
function atualizarParticulas(){
  for(const p of particulas){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96; p.vida--; }
  particulas=particulas.filter(p=>p.vida>0);
}
function desenharParticulas(){
  for(const p of particulas){
    const a=Math.max(0,p.vida/p.vidaMax);
    ctx.fillStyle=p.cor; ctx.globalAlpha=a;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,3*a),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ---------- jogador ----------
let jogador;
function novoJogador(){
  const s=SKINS[progresso.skin];
  return {x:W/2,y:H-90,vx:0,vy:0,r:16,vidas:3,inv:0,cd:0,chama:0,cor:s.cor,chamaCor:s.chama};
}
function atualizarJogador(t){
  const ac=0.6, at=0.9;
  if(t['ArrowLeft']||t['a']) jogador.vx-=ac;
  if(t['ArrowRight']||t['d']) jogador.vx+=ac;
  if(t['ArrowUp']||t['w']) jogador.vy-=ac;
  if(t['ArrowDown']||t['s']) jogador.vy+=ac;
  if(toque){
    jogador.x+=(toque.x-jogador.x)*0.2;
    jogador.y+=(toque.y-70-jogador.y)*0.2;
    jogador.vx=0; jogador.vy=0;
    atirar();
  }
  if(t[' ']||mouseAtivo||autoTiro) atirar();
  jogador.vx*=at; jogador.vy*=at;
  jogador.x=Math.max(20,Math.min(W-20,jogador.x+jogador.vx));
  jogador.y=Math.max(20,Math.min(H-20,jogador.y+jogador.vy));
  if(jogador.cd>0) jogador.cd--;
  if(jogador.inv>0) jogador.inv--;
  jogador.chama=(jogador.chama+1)%20;
}
function atirar(){
  if(jogador.cd===0){
    tiros.push({x:jogador.x-10,y:jogador.y-10,dir:-1});
    tiros.push({x:jogador.x+10,y:jogador.y-10,dir:-1});
    jogador.cd=10; somTiro();
  }
}
function desenharJogador(){
  if(jogador.inv>0 && Math.floor(jogador.inv/6)%2===0) return;
  ctx.fillStyle=jogador.cor; ctx.strokeStyle='#f0f0fa'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(jogador.x,jogador.y-22); ctx.lineTo(jogador.x-16,jogador.y+16);
  ctx.lineTo(jogador.x,jogador.y+8); ctx.lineTo(jogador.x+16,jogador.y+16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const t=10+6*Math.sin(jogador.chama*0.6);
  ctx.fillStyle=jogador.chamaCor;
  ctx.beginPath();
  ctx.moveTo(jogador.x-8,jogador.y+14); ctx.lineTo(jogador.x+8,jogador.y+14); ctx.lineTo(jogador.x,jogador.y+14+t);
  ctx.closePath(); ctx.fill();
}

// ---------- tiros ----------
let tiros=[], tirosInimigos=[];
function atualizarTiros(){
  for(const t of tiros) t.y+=11*t.dir;
  tiros=tiros.filter(t=>t.y>-10&&t.y<H+10);
  for(const t of tirosInimigos) t.y+=8*t.dir;
  tirosInimigos=tirosInimigos.filter(t=>t.y>-10&&t.y<H+10);
}
function desenharTiros(){
  ctx.strokeStyle='#f0f0fa'; ctx.lineWidth=1;
  for(const t of tiros){ ctx.fillStyle='#ffd23c'; ctx.beginPath(); ctx.arc(t.x,t.y,4,0,7); ctx.fill(); ctx.stroke(); }
  for(const t of tirosInimigos){ ctx.fillStyle='#be64ff'; ctx.beginPath(); ctx.arc(t.x,t.y,4,0,7); ctx.fill(); ctx.stroke(); }
}

// ---------- inimigos ----------
let inimigos=[];
function novoInimigo(dif, faseAtual){
  const x=rand(40,W-40), sorteio=Math.random();
  let tipo,cor,vel,r,pts,vida;
  if(faseAtual>=3 && sorteio<0.2){ tipo='tanque'; cor='#6496ff'; vel=rand(0.8,1.3)+dif*0.05; r=22; pts=40; vida=3; }
  else if(sorteio<0.6){ tipo='caçador'; cor='#ff4646'; vel=rand(2,3)+dif*0.15; r=14; pts=10; vida=1; }
  else { tipo='atirador'; cor='#be64ff'; vel=rand(1.2,2); r=16; pts=20; vida=1; }
  return {tipo,cor,x,y:-30,vel,r,pts,vida,vidaMax:vida,cd:rand(40,100)|0,fase:rand(0,7)};
}
function atualizarInimigos(){
  for(const e of inimigos){
    e.fase+=0.05; e.x+=Math.sin(e.fase)*1.5; e.y+=e.vel;
    if(e.tipo==='atirador'||e.tipo==='tanque'){
      e.cd--;
      if(e.cd<=0 && e.y>0 && e.y<H-60){
        tirosInimigos.push({x:e.x,y:e.y+10,dir:1});
        e.cd=(e.tipo==='atirador'?rand(70,130):rand(100,160))|0;
      }
    }
  }
}
function desenharInimigos(){
  for(const e of inimigos){
    ctx.fillStyle=e.cor; ctx.strokeStyle='#f0f0fa'; ctx.lineWidth=2;
    ctx.beginPath();
    if(e.tipo==='tanque'){
      ctx.moveTo(e.x,e.y-20); ctx.lineTo(e.x-18,e.y-4); ctx.lineTo(e.x-18,e.y+14);
      ctx.lineTo(e.x,e.y+22); ctx.lineTo(e.x+18,e.y+14); ctx.lineTo(e.x+18,e.y-4);
    } else {
      ctx.moveTo(e.x,e.y-16); ctx.lineTo(e.x-14,e.y+12); ctx.lineTo(e.x,e.y+4); ctx.lineTo(e.x+14,e.y+12);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if(e.vidaMax>1){
      const lg=34, prop=Math.max(0,e.vida/e.vidaMax);
      ctx.fillStyle='#3c3c3c'; ctx.fillRect(e.x-lg/2,e.y-32,lg,5);
      ctx.fillStyle='#5aff8c'; ctx.fillRect(e.x-lg/2,e.y-32,lg*prop,5);
    }
  }
}

// ---------- estado geral ----------
let pontuacao=0,tempoSpawn=0,fimDeJogo=false,tremor=0,faseJogo=1;
let bannerFase=0,bannerSkinTxt='',bannerSkin=0;
const teclas={};

function novoJogo(){
  jogador=novoJogador(); tiros=[]; tirosInimigos=[]; inimigos=[]; particulas=[];
  pontuacao=0; tempoSpawn=0; fimDeJogo=false; tremor=0; faseJogo=1;
  bannerFase=0; bannerSkinTxt=''; bannerSkin=0;
}
novoJogo();

window.addEventListener('keydown',e=>{
  teclas[e.key]=true;
  if(e.key===' '){ e.preventDefault(); }
  if(e.key==='f'||e.key==='F') autoTiro=!autoTiro;
  if(e.key==='Enter' && fimDeJogo) novoJogo();
  if(['1','2','3','4'].includes(e.key)){
    const idx=parseInt(e.key)-1;
    if(desbloqueadas().includes(idx)){
      progresso.skin=idx; salvar();
      jogador.cor=SKINS[idx].cor; jogador.chamaCor=SKINS[idx].chama;
    }
  }
});
window.addEventListener('keyup',e=>{ teclas[e.key]=false; });
let toque=null, mouseAtivo=false, autoTiro=false;
function posToque(t){
  const r=canvas.getBoundingClientRect();
  return {x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height};
}
canvas.addEventListener('mousedown',()=>{ if(fimDeJogo) novoJogo(); else mouseAtivo=true; });
window.addEventListener('mouseup',()=>{ mouseAtivo=false; });
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(fimDeJogo){ novoJogo(); return; }
  toque=posToque(e.touches[0]);
},{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(e.touches.length) toque=posToque(e.touches[0]); },{passive:false});
const fimToque=e=>{ e.preventDefault(); if(!e.touches.length) toque=null; };
canvas.addEventListener('touchend',fimToque,{passive:false});
canvas.addEventListener('touchcancel',fimToque,{passive:false});

function texto(txt,tam,cor,x,y){
  ctx.font=`bold ${tam}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='#05050f'; ctx.strokeText(txt,x,y);
  ctx.fillStyle=cor; ctx.fillText(txt,x,y);
}

function loop(){
  requestAnimationFrame(loop);
  let desloc=[0,0];
  atualizarEstrelas();

  if(!fimDeJogo){
    atualizarJogador(teclas);
    const dif=pontuacao/150;
    const novaFase=1+Math.floor(pontuacao/200);
    if(novaFase!==faseJogo){ faseJogo=novaFase; bannerFase=100; somFase(); }
    tempoSpawn--;
    if(tempoSpawn<=0){ inimigos.push(novoInimigo(dif,faseJogo)); tempoSpawn=Math.max(18,45-dif*5); }

    atualizarTiros(); atualizarInimigos();

    const recordeAntes=progresso.recorde, vivos=[];
    for(const e of inimigos){
      for(let i=tiros.length-1;i>=0;i--){
        if(dist(tiros[i].x,tiros[i].y,e.x,e.y)<e.r){
          explodir(tiros[i].x,tiros[i].y,'#f0f0fa',6); tiros.splice(i,1); e.vida--; break;
        }
      }
      if(e.vida<=0){
        pontuacao+=e.pts; explodir(e.x,e.y,e.cor); tremor=8; somExplosao();
        if(pontuacao>progresso.recorde) progresso.recorde=pontuacao;
      } else if(e.y<=H+40) vivos.push(e);
    }
    inimigos=vivos;

    if(progresso.recorde>recordeAntes){
      const antes=SKINS.map((s,i)=>i).filter(i=>recordeAntes>=s.recorde);
      const novas=desbloqueadas().filter(i=>!antes.includes(i));
      if(novas.length){
        bannerSkinTxt=`NOVA SKIN DESBLOQUEADA: ${SKINS[Math.max(...novas)].nome}!`; bannerSkin=150; somSkin();
      }
      salvar();
    }

    if(jogador.inv===0){
      for(let i=inimigos.length-1;i>=0;i--){
        const e=inimigos[i];
        if(dist(e.x,e.y,jogador.x,jogador.y)<e.r+jogador.r){
          inimigos.splice(i,1); explodir(jogador.x,jogador.y,'#ff4646',30);
          jogador.vidas--; jogador.inv=90; tremor=16;
          if(jogador.vidas<=0){ fimDeJogo=true; somFim(); } else somDano();
        }
      }
    }
    if(jogador.inv===0){
      for(let i=tirosInimigos.length-1;i>=0;i--){
        const t=tirosInimigos[i];
        if(dist(t.x,t.y,jogador.x,jogador.y)<jogador.r){
          tirosInimigos.splice(i,1); explodir(jogador.x,jogador.y,'#ff4646',20);
          jogador.vidas--; jogador.inv=90; tremor=14;
          if(jogador.vidas<=0){ fimDeJogo=true; somFim(); } else somDano();
        }
      }
    }
  }

  atualizarParticulas();
  if(bannerFase>0) bannerFase--;
  if(bannerSkin>0) bannerSkin--;
  if(tremor>0){ tremor--; desloc=[rand(-6,6),rand(-6,6)]; }

  ctx.save(); ctx.translate(desloc[0],desloc[1]);
  ctx.fillStyle='#05050f'; ctx.fillRect(-10,-10,W+20,H+20);
  desenharEstrelas();
  if(!fimDeJogo) desenharJogador();
  desenharTiros(); desenharInimigos(); desenharParticulas();

  texto(`PONTOS: ${pontuacao}`,26,'#5aff8c',120,30);
  texto(`FASE ${faseJogo}`,18,'#ffd23c',110,58);
  texto(`Tiro automático [F]: ${autoTiro?'LIGADO':'desligado'}`,14,autoTiro?'#50dcff':'#f0f0fa',120,82);
  if(!fimDeJogo) texto('❤'.repeat(Math.max(0,jogador.vidas)),26,'#ff4646',W-90,30);
  if(bannerFase>0) texto(`FASE ${faseJogo}!`,54,'#ffd23c',W/2,H/2-120);
  if(bannerSkin>0) texto(bannerSkinTxt,22,'#5aff8c',W/2,100);

  if(fimDeJogo){
    texto('FIM DE JOGO',54,'#ff4646',W/2,H/2-40);
    texto(`Pontuação final: ${pontuacao}`,24,'#f0f0fa',W/2,H/2+20);
    texto('ENTER (ou toque na tela) para jogar de novo',16,'#50dcff',W/2,H/2+55);
    texto(`Nave atual: ${SKINS[progresso.skin].nome}`,16,'#f0f0fa',W/2,H/2+90);
    const linha=SKINS.map((s,i)=>desbloqueadas().includes(i)?`[${i+1}] ${s.nome}`:`[${i+1}] ??? (${s.recorde}pts)`).join('   ');
    texto(linha,13,'#50dcff',W/2,H/2+118);
  }
  ctx.restore();
}
loop();
})();
</script>
</body>
</html>
